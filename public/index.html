<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patch Watcher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    h1 {
      margin: 0 0 6px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: #181b24;
      border: 1px solid #292e3a;
      border-radius: 12px;
      padding: 20px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #777;
    }

    .online {
      background: #35c759;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: #b8becb;
    }

    input[type="text"],
    input[type="time"],
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #343a48;
      background: #10131a;
      color: white;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      margin: 8px 6px 0 0;
      background: #5865f2;
      color: white;
      font-weight: bold;
    }

    button.secondary {
      background: #303542;
    }

    button.danger {
      background: #8e3540;
    }

    .schedule-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .schedule-row input {
      flex: 1;
    }

    .log {
      height: 360px;
      overflow: auto;
      background: #0b0d12;
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .log-line {
      padding: 6px 4px;
      border-bottom: 1px solid #171a22;
    }

    .error {
      color: #ff7777;
    }

    .warning {
      color: #f2c96d;
    }

    .info {
      color: #cdd2df;
    }

    .success {
      color: #6ee7a1;
    }

    .muted {
      color: #8d94a3;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .server-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #10131a;
      border: 1px solid #292e3a;
    }

    .server-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #303542;
    }

    .server-name {
      font-weight: bold;
    }

    .server-id {
      color: #8d94a3;
      font-size: 12px;
      margin-top: 3px;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>

</head>
